<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pages Sites — топ сайтов на GitHub Pages</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b; --card: rgba(255,255,255,.04); --border: rgba(255,255,255,.1);
    --txt: #f4f4f5; --dim: rgba(255,255,255,.6); --faint: rgba(255,255,255,.4);
    --accent: #6366f1; --accent-hover: #818cf8; --green: #10b981; --pink: #ec4899;
  }
  body {
    background: var(--bg); color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input { font-family: inherit; }

  .header {
    position: sticky; top: 0; z-index: 40;
    background: rgba(9,9,11,.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    max-width: 1152px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .logo-badge {
    width: 36px; height: 36px; border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #d946ef);
    display: grid; place-items: center; font-size: 18px;
    box-shadow: 0 8px 20px rgba(99,102,241,.4);
  }
  .logo-name { font-weight: 800; font-size: 18px; letter-spacing: -.3px; }
  .logo-name span { color: #818cf8; }
  .search-form { flex: 1; display: flex; gap: 8px; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .4; font-size: 13px; }
  .search-input, .filter-input, .token-input {
    width: 100%; height: 40px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid var(--border);
    color: var(--txt); padding: 0 16px 0 38px; font-size: 14px; outline: none;
  }
  .search-input:focus, .filter-input:focus, .token-input:focus { box-shadow: 0 0 0 2px rgba(99,102,241,.55); }
  .search-input::placeholder, .filter-input::placeholder, .token-input::placeholder { color: rgba(255,255,255,.35); }
  .btn-primary {
    height: 40px; padding: 0 18px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 20px rgba(99,102,241,.3);
    transition: background .15s, transform .1s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(.95); }

  .chips {
    max-width: 1152px; margin: 0 auto; padding: 0 16px 10px;
    display: flex; align-items: center; gap: 8px; overflow-x: auto; font-size: 12px;
  }
  .chips .label { color: var(--faint); flex-shrink: 0; }
  .chip {
    padding: 6px 12px; border-radius: 999px; font-weight: 500; white-space: nowrap;
    background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--dim);
    transition: all .15s; font-size: 12px;
  }
  .chip:hover { color: #fff; }
  .chip.active { background: var(--accent); border-color: #818cf8; color: #fff; }
  .chip.green.active { background: rgba(16,185,129,.15); border-color: rgba(16,185,129,.35); color: #6ee7b7; }
  .chip-spacer { margin-left: auto; }

  .main { max-width: 1152px; margin: 0 auto; padding: 20px 16px 96px; }
  .filter-row { max-width: 380px; margin-bottom: 16px; position: relative; }
  .filter-input { height: 36px; font-size: 12px; padding-left: 32px; background: rgba(255,255,255,.05); }
  .filter-row .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.35); font-size: 11px; }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .section-title .count { font-size: 14px; font-weight: 400; color: var(--faint); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card {
    border-radius: 24px; background: var(--card); border: 1px solid var(--border);
    overflow: hidden; transition: background .15s, border-color .15s;
  }
  .card:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.2); }
  .card-banner { height: 112px; position: relative; }
  .card-banner .emoji { position: absolute; top: 12px; left: 16px; font-size: 44px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .card-banner .rank {
    position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
    border-radius: 12px; background: rgba(0,0,0,.45); color: #fff;
    font-weight: 800; font-size: 13px; display: grid; place-items: center;
    backdrop-filter: blur(4px);
  }
  .card-banner .host {
    position: absolute; bottom: 10px; left: 16px; max-width: 85%;
    background: rgba(0,0,0,.45); color: rgba(255,255,255,.85);
    font-size: 11px; font-family: ui-monospace, monospace;
    padding: 4px 10px; border-radius: 8px; backdrop-filter: blur(4px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-body { padding: 16px 16px 8px; }
  .card-head { display: flex; align-items: flex-start; gap: 12px; }
  .card-icon {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 16px;
    display: grid; place-items: center; font-size: 24px;
    box-shadow: 0 8px 16px rgba(0,0,0,.35);
  }
  .card-name { min-width: 0; flex: 1; }
  .card-name h3 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-name p { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-stats { flex-shrink: 0; font-size: 11px; display: flex; flex-direction: column; gap: 2px; text-align: right; }
  .card-stats .stars { color: #fcd34d; }
  .card-stats .forks { color: var(--faint); }
  .card-desc {
    margin-top: 12px; font-size: 13px; color: var(--dim); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-actions { padding: 0 16px 16px; display: flex; gap: 8px; }
  .btn-open {
    flex: 1; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 20px rgba(99,102,241,.3); transition: background .15s, transform .1s;
  }
  .btn-open:hover { background: var(--accent-hover); }
  .btn-open:active { transform: scale(.95); }
  .btn-like {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px;
    display: grid; place-items: center; background: rgba(255,255,255,.1);
    color: var(--dim); transition: all .15s; font-size: 17px;
  }
  .btn-like:hover { color: #fff; }
  .btn-like.liked { background: rgba(236,72,153,.2); color: #f472b6; }

  .status { text-align: center; padding: 80px 16px; color: var(--faint); }
  .status .big { font-size: 48px; margin-bottom: 16px; }
  .status p { font-weight: 500; margin-bottom: 4px; color: var(--dim); }
  .status .hint { font-size: 12px; margin-bottom: 20px; }
  .status .row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .btn-green {
    height: 44px; padding: 0 24px; border-radius: 999px;
    background: var(--green); color: #fff; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 20px rgba(16,185,129,.3); transition: background .15s, transform .1s;
  }
  .btn-green:hover { filter: brightness(1.1); }
  .btn-green:active { transform: scale(.95); }
  .spinner {
    width: 20px; height: 20px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.25); border-top-color: #fff;
    animation: spin .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .liked-section { margin-top: 48px; }
  .footer-note { margin-top: 40px; text-align: center; font-size: 11px; color: rgba(255,255,255,.25); }

  /* Детальный экран */
  .detail { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
  .detail-hero { height: 220px; position: relative; }
  .detail-hero::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.25); }
  .detail-hero .emoji { position: absolute; left: 24px; bottom: 56px; font-size: 96px; z-index: 1; filter: drop-shadow(0 8px 20px rgba(0,0,0,.5)); }
  .detail-back {
    position: absolute; top: 16px; left: 16px; z-index: 2; width: 40px; height: 40px;
    border-radius: 50%; background: rgba(0,0,0,.4); color: #fff; font-size: 18px;
    display: grid; place-items: center; backdrop-filter: blur(4px);
  }
  .detail-back:hover { background: rgba(0,0,0,.6); }
  .detail-inner { max-width: 672px; margin: -48px auto 0; padding: 0 24px 96px; position: relative; }
  .detail-head { display: flex; gap: 16px; }
  .detail-icon {
    flex-shrink: 0; width: 96px; height: 96px; border-radius: 24px;
    display: grid; place-items: center; font-size: 48px;
    box-shadow: 0 20px 40px rgba(0,0,0,.5); border: 4px solid var(--bg);
  }
  .detail-title { padding-top: 48px; min-width: 0; }
  .detail-title h1 { font-size: 24px; font-weight: 700; }
  .detail-title .url { font-size: 12px; font-family: ui-monospace, monospace; color: #818cf8; word-break: break-all; }
  .detail-actions { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-visit {
    height: 48px; padding: 0 32px; border-radius: 16px; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 15px;
    box-shadow: 0 12px 30px rgba(99,102,241,.35); transition: all .15s;
  }
  .btn-visit:hover { background: var(--accent-hover); }
  .btn-visit:active { transform: scale(.95); }
  .btn-repo {
    height: 48px; padding: 0 20px; border-radius: 16px; display: grid; place-items: center;
    background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); font-size: 14px; font-weight: 500;
    transition: background .15s;
  }
  .btn-repo:hover { background: rgba(255,255,255,.15); }
  .detail-stats { margin-top: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
  .stat-box { border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid var(--border); padding: 16px 4px; }
  .stat-box .v { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .stat-box .l { font-size: 12px; color: var(--faint); }
  .detail-readme { margin-top: 32px; }
  .detail-readme h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; font-weight: 400; padding: 2px 8px; border-radius: 999px;
    background: rgba(99,102,241,.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,.25);
  }
  .detail-readme p { color: var(--dim); font-size: 14px; line-height: 1.65; }
  .detail-topics { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px; }
          .topic {
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
    background: rgba(99,102,241,.1); color: #a5b4fc; border: 1px solid rgba(99,102,241,.2);
  }
  .trans-note { margin-top: 6px; font-size: 10px; color: rgba(255,255,255,.3); font-style: italic; }

  /* Модалка токена */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.7);
    backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px;
  }
  .modal {
    width: 100%; max-width: 420px; background: #18181b;
    border: 1px solid var(--border); border-radius: 24px; padding: 24px;
  }
  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .modal .sub { font-size: 12px; color: var(--faint); margin-bottom: 16px; line-height: 1.5; }
  .modal ol {
    font-size: 12px; color: var(--dim); padding: 12px 12px 12px 28px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 16px; margin-bottom: 16px; line-height: 1.7;
  }
  .modal ol a { color: #818cf8; text-decoration: underline; }
  .token-input { padding-left: 16px; font-family: ui-monospace, monospace; }
  .modal-row { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn-text { height: 40px; padding: 0 16px; border-radius: 12px; font-size: 13px; background: transparent; color: var(--faint); }
  .btn-text:hover { color: #fff; }
  .btn-danger { color: #fb7185; }
  .btn-danger:hover { color: #f43f5e; }

  @media (max-width: 640px) {
    .logo-name, .header-top form .btn-primary { display: none; }
    .detail-stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ---------- Состояние ---------- */
  var state = {
    sites: [], loading: true, error: null,
    query: "", searchInput: "", sort: "stars", minStars: 100,
    detail: null, showToken: false, tokenInput: "", token: "",
    likes: [],
    qualList: [], page: 1, hasMore: true, moreLoading: false, loadFailed: false,
    autoTranslate: true, translations: {}
  };

  var storage = (function () {
    var mem = {};
    try {
      var t = "__test__";
      window.localStorage.setItem(t, "1");
      window.localStorage.removeItem(t);
      return window.localStorage;
    } catch (e) {
      return {
        getItem: function (k) { return k in mem ? mem[k] : null; },
        setItem: function (k, v) { mem[k] = String(v); },
        removeItem: function (k) { delete mem[k]; }
      };
    }
  })();
  try { state.token = storage.getItem("pagessites_token") || ""; } catch (e) {}
  try { state.likes = JSON.parse(storage.getItem("pagessites_likes") || "[]"); } catch (e) {}
  try { state.autoTranslate = storage.getItem("pagessites_autotranslate") !== "0"; } catch (e) {}
  var transCache = {};
  try { transCache = JSON.parse(storage.getItem("pagessites_trans") || "{}"); } catch (e) {}
  var transBusy = 0;
  function saveTransCache() {
    try { storage.setItem("pagessites_trans", JSON.stringify(transCache)); } catch (e) {}
  }

  /* ---------- Перевод ---------- */
  function needsTranslation(text) {
    if (!text) return false;
    var cyr = (text.match(/[а-яё]/gi) || []).length;
    var lat = (text.match(/[a-z]/gi) || []).length;
    /* если латиницы заметно больше, чем кириллицы — надо переводить */
    return lat > cyr + 2;
  }

  function translateViaGoogle(text) {
    return fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=" + encodeURIComponent(text))
      .then(function (r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
      .then(function (data) {
        var out = "";
        (data && data[0] || []).forEach(function (part) { if (part && part[0]) out += part[0]; });
        if (!out) throw new Error("empty");
        return out;
      });
  }

  function translateViaMyMemory(text) {
    return fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text.slice(0, 450)) + "&langpair=en|ru")
      .then(function (r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
      .then(function (data) {
        var t = data && data.responseData && data.responseData.translatedText;
        if (!t || /^(MYMEMORY WARNING|INVALID)/i.test(t)) throw new Error("bad");
        return t;
      });
  }

  /* Очередь перевода: не больше 2 параллельных запросов */
  function scheduleTranslation(key, text) {
    if (transCache[key] || transBusy >= 2) return;
    transBusy++;
    var done = false;
    function finish(t) { if (done) return; done = true; transBusy--; transCache[key] = t; saveTransCache(); state.translations[key] = t; render(); }
    function fail() { if (done) return; done = true; transBusy--; }
    translateViaGoogle(text).then(finish).catch(function () {
      translateViaMyMemory(text).then(finish).catch(fail);
    });
  }

  /* Возвращает описание с учётом настройки автоперевода */
  function descOf(s) {
    if (!state.autoTranslate) return s.desc;
    var key = s.owner + "/" + s.repo;
    if (transCache[key]) return transCache[key];
    if (needsTranslation(s.desc)) scheduleTranslation(key, s.desc);
    return s.desc;
  }

  /* ---------- Утилиты ---------- */
  function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "k" : "" + n; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  var PALETTES = [
    ["#6366f1", "#5b21b6"], ["#10b981", "#115e59"], ["#f43f5e", "#881337"],
    ["#f59e0b", "#7c2d12"], ["#0ea5e9", "#164e63"], ["#d946ef", "#581c87"],
    ["#84cc16", "#3f6212"], ["#3b82f6", "#312e81"]
  ];
  var EMOJIS = ["🌐", "🚀", "⚡", "🎨", "📘", "🧩", "🔮", "🛠️"];
  function hash(str) { var h = 0; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h); }
  function gradOf(id) { var p = PALETTES[hash(id) % PALETTES.length]; return "linear-gradient(135deg," + p[0] + "," + p[1] + ")"; }
  function emojiOf(id) { return EMOJIS[hash(id + "e") % EMOJIS.length]; }
  function titleOf(name) {
    return name.replace(/[-_.]/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function pagesUrl(r) {
    if (r.homepage && /^https?:\/\//.test(r.homepage)) return r.homepage;
    if (r.has_pages === true) return "https://" + r.owner.login + ".github.io/" + r.name + "/";
    return null;
  }

  /* ---------- Поиск GitHub ---------- */
  function buildQuals(q, minS) {
    return q
      ? [q + " in:name,description,topics stars:>=" + Math.min(minS, 10)]
      : ["github.io in:name stars:>=" + minS, "topic:github-pages stars:>=" + minS, "github pages in:description stars:>=" + minS];
  }

  function ghHeaders(tok) {
    var h = { "Accept": "application/vnd.github+json" };
    if (tok) h["Authorization"] = "Bearer " + tok;
    return h;
  }

  /* Новый поиск: сбрасываем пагинацию */
  function search(q, sortBy, minS, tok) {
    state.loading = true; state.error = null;
    state.qualList = buildQuals(q, minS);
    state.page = 1; state.hasMore = true; state.moreLoading = false; state.loadFailed = false;
    render();
    runPage(sortBy, tok);
  }

  /* Загрузить ещё: следующая страница тех же запросов */
  function loadMore() {
    if (state.moreLoading || state.loading || !state.hasMore || state.qualList.length === 0) return;
    state.moreLoading = true; state.loadFailed = false;
    state.page++;
    render();
    runPage(state.sort, state.token);
  }

  /* Выполняет одну страницу по всем запросам и мерджит результат */
  function runPage(sortBy, tok) {
    var isNew = state.page === 1;
    var headers = ghHeaders(tok);
    var done = 0, raw = [], limited = false;

    state.qualList.forEach(function (qual) {
      fetch("https://api.github.com/search/repositories?per_page=50&order=desc&sort=" +
            (sortBy === "forks" ? "forks" : sortBy === "stars" ? "stars" : "updated") +
            "&page=" + state.page + "&q=" + encodeURIComponent(qual), { headers: headers })
        .then(function (res) {
          if (!res.ok) throw new Error("status " + res.status);
          return res.json();
        })
        .then(function (data) { raw = raw.concat(data.items || []); })
        .catch(function (err) { if (/status 40[13]/.test(err.message)) limited = true; })
        .finally(function () {
          done++;
          if (done === state.qualList.length) finishPage(raw, limited, isNew, sortBy);
        });
    });
  }

  function finishPage(raw, limited, isNew, sortBy) {
    var byKey = {};
    var prev = isNew ? [] : state.sites;
    prev.forEach(function (s) { byKey[s.owner + "/" + s.repo] = s; });
    var prevCount = prev.length;

    raw.forEach(function (r) {
      var key = r.owner.login + "/" + r.name;
      if (byKey[key]) return;
      var u = pagesUrl(r);
      if (!u) return;
      byKey[key] = {
        id: "" + r.id, owner: r.owner.login, repo: r.name,
        title: titleOf(r.name),
        desc: r.description || "Описание отсутствует — открой README репозитория.",
        url: u, stars: r.stargazers_count || 0, forks: r.forks_count || 0,
        lang: r.language || "—", topics: r.topics || [],
        color: gradOf("" + r.id), emoji: emojiOf("" + r.id)
      };
    });

    var items = Object.keys(byKey).map(function (k) { return byKey[k]; });
    items.sort(function (a, b) {
      if (sortBy === "forks") return b.forks - a.forks;
      if (sortBy === "name") return a.title.localeCompare(b.title);
      return b.stars - a.stars;
    });

    var added = items.length - prevCount;
    state.sites = items;

    if (isNew) {
      state.loading = false;
      if (raw.length === 0) {
        state.sites = [];
        state.error = limited
          ? "Лимит GitHub API исчерпан. Подключи аккаунт GitHub или подожди минуту."
          : "Не удалось получить данные — возможно, нет доступа к сети. Попробуй ещё раз.";
      } else if (items.length === 0) {
        state.error = "Ничего не найдено — попробуй другой запрос или снизь порог звёзд.";
      }
    } else {
      state.moreLoading = false;
      /* API отдал меньше полного блока или не добавил ничего нового — значит, дальше пусто */
      if (raw.length === 0 || added === 0) state.hasMore = false;
      if (raw.length === 0 && limited) {
        /* Авто-загрузка упёрлась в лимит — покажем кнопку «Загрузить ещё» */
        state.loadFailed = true;
      }
    }
    render();
  }

  /* ---------- Ранжирование и фильтрация ---------- */
  function ranked() {
    return state.sites.slice().sort(function (a, b) { return (b.stars + b.forks) - (a.stars + a.forks); });
  }
  function rankOf(id) {
    var r = ranked();
    for (var i = 0; i < r.length; i++) if (r[i].id === id) return i + 1;
    return 0;
  }
  function filtered() {
    var q = state.query.toLowerCase();
    return ranked().filter(function (s) {
      if (!q) return true;
      return (s.title.toLowerCase().indexOf(q) >= 0) ||
             (s.owner.toLowerCase().indexOf(q) >= 0) ||
             (s.repo.toLowerCase().indexOf(q) >= 0) ||
             s.topics.some(function (t) { return t.toLowerCase().indexOf(q) >= 0; });
    });
  }
  function likedList() {
    var ids = state.likes;
    return filtered().filter(function (s) { return ids.indexOf(s.id) >= 0; });
  }
  function toggleLike(id) {
    var i = state.likes.indexOf(id);
    if (i >= 0) state.likes.splice(i, 1); else state.likes.push(id);
    try { storage.setItem("pagessites_likes", JSON.stringify(state.likes)); } catch (e) {}
    render();
  }

  /* ---------- Карточка ---------- */
  function cardHTML(s, rank, liked) {
    var host = s.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    var desc = descOf(s);
    var isTranslated = state.autoTranslate && desc !== s.desc;
    return (
      '<div class="card">' +
        '<button class="card-banner" style="background:' + s.color + '" data-open="' + s.id + '">' +
          '<span class="emoji">' + s.emoji + '</span>' +
          (rank ? '<span class="rank">#' + rank + '</span>' : '') +
          '<span class="host">' + esc(host) + '</span>' +
        '</button>' +
        '<div class="card-body">' +
          '<div class="card-head">' +
            '<div class="card-icon" style="background:' + s.color + '">' + s.emoji + '</div>' +
            '<div class="card-name"><h3>' + esc(s.title) + '</h3><p>' + esc(s.owner) + '/' + esc(s.repo) + '</p></div>' +
            '<div class="card-stats">' +
              '<span class="stars">★ ' + fmt(s.stars) + '</span>' +
              '<span class="forks">⑂ ' + fmt(s.forks) + '</span>' +
            '</div>' +
          '</div>' +
          '<p class="card-desc">' + esc(desc) + '</p>' +
          (isTranslated ? '<p class="trans-note">🌐 автоперевод</p>' : '') +
        '</div>' +
        '<div class="card-actions">' +
          '<a class="btn-open" href="' + esc(s.url) + '" target="_blank" rel="noreferrer">Открыть сайт ↗</a>' +
          '<button class="btn-like' + (liked ? ' liked' : '') + '" data-like="' + s.id + '">' + (liked ? '♥' : '♡') + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  /* ---------- Рендер ---------- */
  var app = document.getElementById("app");

  function render() {
    if (state.detail) { renderDetail(); return; }
    var list = filtered();
    var likes = likedList();

    var html =
      '<div class="header">' +
        '<div class="header-top">' +
          '<div class="logo"><div class="logo-badge">🌐</div><div class="logo-name">Pages<span>Sites</span></div></div>' +
          '<form class="search-form" id="search-form">' +
            '<div class="search-wrap"><span class="icon">🔍</span>' +
              '<input class="search-input" id="search-input" placeholder="Искать GitHub Pages сайты: тема, название, автор…" value="' + esc(state.searchInput) + '" />' +
            '</div>' +
            '<button class="btn-primary" type="submit">Найти</button>' +
          '</form>' +
        '</div>' +
        '<div class="chips">' +
          '<span class="label">Сортировка:</span>' +
          chip("stars", "⭐ Stars") + chip("forks", "🍴 Forks") + chip("name", "🔤 Имя") +
          '<span class="label" style="margin-left:8px">Мин. звёзды:</span>' +
          starChip(0, "все") + starChip(100, "100+") + starChip(1000, "1k+") + starChip(5000, "5k+") +
          '<button class="chip chip-spacer" data-act="top">↻ Топ Pages Sites</button>' +
          '<button class="chip' + (state.autoTranslate ? ' active' : '') + '" data-act="translate" title="Переключить между автопереводом и оригиналом">' +
            (state.autoTranslate ? '🌐 Автоперевод' : '📄 Показывать оригинал') +
          '</button>' +
          '<button class="chip green' + (state.token ? ' active' : '') + '" data-act="token">' +
            (state.token ? '● Аккаунт подключён' : '🔗 Подключить GitHub') +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="main">' +
        '<div class="filter-row"><span class="icon">↓</span>' +
          '<input class="filter-input" id="filter-input" placeholder="Фильтр в результатах…" value="' + esc(state.query) + '" />' +
        '</div>' +
        '<div class="section-title">' +
          (state.searchInput ? '🔎 «' + esc(state.searchInput) + '»' : '🏆 Топ GitHub Pages') +
          '<span class="count">' + state.sites.length + ' сайтов</span>' +
        '</div>';

    if (state.loading) {
      html += '<div class="status"><div class="spinner"></div><p>Ищем сайты на GitHub Pages…</p></div>';
    } else if (state.error) {
      html += '<div class="status"><div class="big">😕</div><p>' + esc(state.error) + '</p>' +
              '<p class="hint">Без токена GitHub даёт 10 поисков в минуту.</p>' +
              '<div class="row">' +
                '<button class="btn-primary" style="height:44px;padding:0 24px" data-act="retry">↻ Попробовать ещё раз</button>' +
                (state.token ? '' : '<button class="btn-green" data-act="token">🔗 Подключить GitHub</button>') +
              '</div></div>';
    } else if (list.length === 0) {
      html += '<div class="status"><div class="big">🔎</div><p>Ничего не найдено</p></div>';
    } else {
      html += '<div class="grid">';
      list.forEach(function (s) {
        html += cardHTML(s, rankOf(s.id), state.likes.indexOf(s.id) >= 0);
      });
      html += '</div>';

      /* Бесконечная прокрутка: авто-загрузка при конце списка, кнопка при неудаче */
      if (state.moreLoading) {
        html += '<div class="status" style="padding:28px"><div class="spinner"></div><p>Загружаем ещё…</p></div>';
      } else if (state.hasMore) {
        if (state.loadFailed) {
          html += '<div class="status" style="padding:28px"><p class="hint" style="margin-bottom:12px">Авто-загрузка не удалась (возможно, лимит GitHub API)</p>' +
                  '<button class="btn-primary" style="height:44px;padding:0 24px" data-act="load-more">↓ Загрузить ещё</button></div>';
        }
        html += '<div id="sentinel" style="height:1px"></div>';
      } else {
        html += '<div class="status" style="padding:28px"><p class="hint">🎉 Это все сайты по текущему запросу</p></div>';
      }
    }

    if (likes.length > 0) {
      html += '<div class="liked-section"><div class="section-title">❤️ Любимые сайты <span class="count">' + likes.length + '</span></div><div class="grid">';
      likes.forEach(function (s) { html += cardHTML(s, 0, true); });
      html += '</div></div>';
    }

    html += '<p class="footer-note">Данные — GitHub Search API · Рейтинг = Stars + Forks · ' +
            (state.token ? 'Аккаунт подключён: 30 поисков/мин' : 'Без токена: 10 поисков/мин') + '</p>';
    html += '</div>';

    if (state.showToken) html += tokenModalHTML();

    app.innerHTML = html;
    bindEvents();
  }

  function chip(id, label) {
    return '<button class="chip' + (state.sort === id ? ' active' : '') + '" data-sort="' + id + '">' + label + '</button>';
  }
  function starChip(n, label) {
    return '<button class="chip' + (state.minStars === n ? ' active' : '') + '" data-min="' + n + '">' + label + '</button>';
  }

  function tokenModalHTML() {
    return '<div class="modal-overlay" id="modal-overlay"><div class="modal">' +
      '<h3>🔗 Подключить аккаунт GitHub</h3>' +
      '<p class="sub">Вставь Personal Access Token — лимит вырастет с 10 до 30 поисков в минуту. Токен хранится только в твоём браузере.</p>' +
      '<ol><li>Открой <a href="https://github.com/settings/tokens/new?description=Pages%20Sites" target="_blank" rel="noreferrer">github.com/settings/tokens/new</a></li>' +
      '<li>Права не нужны — можно ничего не отмечать</li>' +
      '<li>Сгенерируй и вставь ниже</li></ol>' +
      '<input class="token-input" id="token-input" placeholder="ghp_… или github_pat_…" value="' + esc(state.tokenInput) + '" />' +
      '<div class="modal-row">' +
        (state.token ? '<button class="btn-text btn-danger" data-act="disconnect" style="margin-right:auto">Отключить аккаунт</button>' : '') +
        '<button class="btn-text" data-act="close-modal">Закрыть</button>' +
        '<button class="btn-green" data-act="connect">Подключить</button>' +
      '</div></div></div>';
  }

  /* ---------- Детальный экран ---------- */
  function renderDetail() {
    var s = null;
    for (var i = 0; i < state.sites.length; i++) if (state.sites[i].id === state.detail) { s = state.sites[i]; break; }
    if (!s) { state.detail = null; render(); return; }
    var host = s.url.replace(/^https?:\/\//, "");
    var key = s.owner + "/" + s.repo;

    app.innerHTML =
      '<div class="detail">' +
        '<div class="detail-hero" style="background:' + s.color + '">' +
          '<button class="detail-back" data-act="back">←</button>' +
          '<span class="emoji">' + s.emoji + '</span>' +
        '</div>' +
        '<div class="detail-inner">' +
          '<div class="detail-head">' +
            '<div class="detail-icon" style="background:' + s.color + '">' + s.emoji + '</div>' +
            '<div class="detail-title"><h1>' + esc(s.title) + '</h1><p class="url">' + esc(host) + '</p></div>' +
          '</div>' +
          '<div class="detail-actions">' +
            '<a class="btn-visit" href="' + esc(s.url) + '" target="_blank" rel="noreferrer">Перейти на сайт ↗</a>' +
            '<a class="btn-repo" href="https://github.com/' + encodeURIComponent(s.owner) + '/' + encodeURIComponent(s.repo) + '" target="_blank" rel="noreferrer">Репозиторий ↗</a>' +
          '</div>' +
          '<div class="detail-stats">' +
            statBox("⭐ " + fmt(s.stars), "Stars") + statBox(fmt(s.forks), "Forks") +
            statBox(esc(s.lang), "Язык") + statBox("#" + rankOf(s.id), "Рейтинг") +
          '</div>' +
          '<div class="detail-readme"><h2>📄 README <span class="badge">из ' + esc(s.owner) + '/' + esc(s.repo) + '</span></h2>' +
            '<p id="readme-body">' + esc(descOf(s)) + '</p>' +
            '<p id="readme-note" class="trans-note" style="display:none">🌐 автоперевод</p></div>' +
          '<div class="detail-topics">' + s.topics.slice(0, 10).map(function (t) { return '<span class="topic">' + esc(t) + '</span>'; }).join("") + '</div>' +
        '</div>' +
      '</div>';

    fetch("https://api.github.com/repos/" + s.owner + "/" + s.repo + "/readme", { headers: { "Accept": "application/vnd.github.raw+json" } })
      .then(function (r) { if (!r.ok) throw new Error(); return r.text(); })
      .then(function (text) {
        var clean = text
          .replace(/<!--[\s\S]*?-->/g, "")
          .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
          .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
          .replace(/[<>`*#|]/g, "")
          .split("\n").map(function (l) { return l.trim(); }).filter(Boolean)
          .slice(0, 12).join(" ").slice(0, 700);
        var el = document.getElementById("readme-body");
        if (!el || clean.length <= 40) return;
        if (state.autoTranslate && needsTranslation(clean)) {
          translateViaGoogle(clean).catch(function () { return translateViaMyMemory(clean); })
            .then(function (t) {
              transCache[key] = t; saveTransCache();
              var e2 = document.getElementById("readme-body");
              var n2 = document.getElementById("readme-note");
              if (e2) e2.textContent = t;
              if (n2) n2.style.display = "block";
            })
            .catch(function () { el.textContent = clean; });
        } else {
          el.textContent = clean;
        }
      })
      .catch(function () {});

    bindEvents();
  }
  function statBox(v, l) { return '<div class="stat-box"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

  /* ---------- События ---------- */
  function bindEvents() {
    var form = document.getElementById("search-form");
    if (form) form.addEventListener("submit", function (e) {
      e.preventDefault();
      state.query = "";
      search(state.searchInput, state.sort, state.minStars, state.token);
    });

    var si = document.getElementById("search-input");
    if (si) si.addEventListener("input", function (e) { state.searchInput = e.target.value; });
    var fi = document.getElementById("filter-input");
    if (fi) fi.addEventListener("input", function (e) {
      state.query = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var el = document.getElementById("filter-input");
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    });
    var ti = document.getElementById("token-input");
    if (ti) ti.addEventListener("input", function (e) { state.tokenInput = e.target.value; });

    document.querySelectorAll("[data-sort]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.sort = b.getAttribute("data-sort");
        search(state.searchInput, state.sort, state.minStars, state.token);
      });
    });
    document.querySelectorAll("[data-min]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.minStars = parseInt(b.getAttribute("data-min"), 10);
        search(state.searchInput, state.sort, state.minStars, state.token);
      });
    });
    document.querySelectorAll("[data-like]").forEach(function (b) {
      b.addEventListener("click", function () { toggleLike(b.getAttribute("data-like")); });
    });
    document.querySelectorAll("[data-open]").forEach(function (b) {
      b.addEventListener("click", function () { state.detail = b.getAttribute("data-open"); render(); });
    });

    document.querySelectorAll("[data-act]").forEach(function (b) {
      b.addEventListener("click", function () {
        var act = b.getAttribute("data-act");
        if (act === "top") { state.searchInput = ""; state.query = ""; search("", state.sort, state.minStars, state.token); }
        if (act === "retry") { search(state.searchInput, state.sort, state.minStars, state.token); }
        if (act === "load-more") { state.loadFailed = false; loadMore(); }
        if (act === "translate") {
          state.autoTranslate = !state.autoTranslate;
          try { storage.setItem("pagessites_autotranslate", state.autoTranslate ? "1" : "0"); } catch (e) {}
          render();
        }
        if (act === "token") { state.showToken = true; render(); }
        if (act === "close-modal") { state.showToken = false; render(); }
        if (act === "disconnect") { state.token = ""; state.tokenInput = ""; try { storage.removeItem("pagessites_token"); } catch (e) {} state.showToken = false; render(); }
        if (act === "connect") {
          state.token = state.tokenInput.trim();
          try { state.token ? storage.setItem("pagessites_token", state.token) : storage.removeItem("pagessites_token"); } catch (e) {}
          state.showToken = false;
          search(state.searchInput, state.sort, state.minStars, state.token);
        }
        if (act === "back") { state.detail = null; render(); }
      });
    });

    var ov = document.getElementById("modal-overlay");
    if (ov) ov.addEventListener("click", function (e) {
      if (e.target === ov) { state.showToken = false; render(); }
    });

    /* Авто-загрузка при прокрутке до конца списка */
    var sentinel = document.getElementById("sentinel");
    if (sentinel && typeof IntersectionObserver !== "undefined") {
      var io = new IntersectionObserver(function (entries) {
        if (entries.some(function (en) { return en.isIntersecting; })) {
          io.disconnect();
          loadMore();
        }
      }, { rootMargin: "400px" });
      io.observe(sentinel);
    }
  }

  /* ---------- Старт ---------- */
  render();
  search("", "stars", 100, state.token);
})();
</script>
</body>
</html>
